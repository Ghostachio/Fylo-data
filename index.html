<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Fylo Data</title>
  </head>
  <body>
    <main class="container">
      <section>
        <img src="./images/logo.svg" alt="logo" id="logo" />
        <div>
          <img src="./images/icon-document.svg" alt="" /><img
            src="./images/icon-folder.svg"
            alt=""
          /><img src="./images/icon-upload.svg" alt="" />
        </div>
      </section>
      <section>
        <p class="title">
          You've used <span class="bold">815GB</span> of your storage
        </p>
        <input type="range" min="0" max="1000" value="815" class="range" />
        <ul>
          <li class="bold">0GB</li>
          <li class="bold">1000GB</li>
        </ul>
      </section>
    </main>
  </body>
</html>
